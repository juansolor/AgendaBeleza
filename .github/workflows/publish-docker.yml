name: Build and Publish Docker Images

on:
  push:
    branches: [ juan ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/api
          file: ./backend/api/Dockerfile
          push: true
          tags: ghcr.io/${{ secrets.GHCR_OWNER }}/agenda-beleza-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/vite-app
          file: ./frontend/vite-app/Dockerfile
          push: true
          tags: ghcr.io/${{ secrets.GHCR_OWNER }}/agenda-beleza-frontend:latest

  run-migrations:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend/api
        run: npm ci
      - name: Run migrations (production) if DATABASE_URL provided
        working-directory: backend/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: ${{ secrets.DB_SSL }}
          NODE_ENV: production
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL not provided; skipping migrations/seeds.";
            exit 0;
          fi
          npx sequelize-cli db:migrate --env production
          npx sequelize-cli db:seed:all --env production
